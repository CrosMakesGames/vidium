# ============================================================================
#  Vidium layout.conf - player configuration
# ----------------------------------------------------------------------------
#  This file configures every button, overlay and behavior of the player.
#  Edit it, push to GitHub, and the deployment updates in ~2 minutes.
#
#  Format:  [section]  /  key = value
#  Values:  true / false, numbers, #hex colors, or "quoted text"
#  Lines starting with # or ; are comments.
# ============================================================================

[brand]
# Shown on the landing page, in the browser tab, and on the idle screen.
name = "Vidium"
# Default accent color for buttons, seek bar and highlights.
# Per-link override: append ?color=#ff5e3a to any player URL.
accent = #8B5CF6

[controls]
# Turn any control on or off. The player rebuilds its button row from these.
servers = true          ; server picker chip (Server 1 / 2 / 3 ...)
quality = true          ; quality chip (Auto / 1080p / 720p ...)
speed = true            ; playback speed chip (0.5x ... 2x)
subtitles = true        ; CC chip and subtitle styling panel
audio = true            ; Audio panel (mono fix, boost, balance, sync)
pip = true              ; picture-in-picture button (desktop)
next = true             ; next-episode button in the control row
episodes = true         ; episode browser button (TV only)
settings = true         ; gear menu (skip intro tuning)
fullscreen = true
volume_slider = true

[idle_screen]
# The pre-play screen with backdrop, rating, description and a resume option.
enabled = true
autoplay = true         ; playback starts by itself once the stream is ready
                        ; (per-link override with ?autoplay=1)
eyebrow_text = "YOU'RE WATCHING"   ; small caps line above the title
                        ; ("YOU'RE WATCHING" | "NOW SHOWING" | "" to hide)
show_description = true ; show the TMDB overview text
show_meta = true        ; show the chips (rating / year / runtime / cert)
dim = 0.55              ; backdrop brightness, 0 (black) to 1 (full)
backdrop_zoom = true    ; slow subtle drift on the backdrop image

[pause_info]
# What shows when you pause: the video frame stays exactly where it is and
# the episode/movie info fades in over it (NOT the artwork preload screen).
# After 15 seconds of pause the backdrop dim eases in gently.
enabled = true
delay = 0               ; milliseconds to wait before the info fades in
show_episode_overview = true
show_rating = true
animate = true          ; fade the text block in when the screen appears

[pause_info]
# When paused (or before starting), fade in show/episode info from TMDB.
enabled = true
delay = 5               ; seconds paused before the info fades in
show_episode_overview = true
show_rating = true
show_genres = true

[skip_intro]
enabled = true
button_text = "Skip Intro"
show_at = 3             ; seconds into the episode when the button appears
                        ; (a community-verified intro start overrides this,
                        ;  so the button waits out cold opens)
default_seek = 85       ; where the jump lands by default (a guess - see
                        ; use_introdb; long-press the video (1s) during the
                        ; intro to mark the real end for this show - saved
                        ; per show and it always wins over everything else)
use_introdb = true      ; look up real intro times per episode from
                        ; api.theintrodb.org (community-verified, no key,
                        ; fetched by the browser - your own markers and
                        ; this default only apply to episodes nobody
                        ; has timed yet)
auto_hide_after = 115   ; button hides itself after this many seconds

[next_episode]
# "When the credits start" = this many seconds before the end of the file.
enabled = true
show_before_end = 75    ; seconds remaining when the card slides in
button_text = "Play Now"
auto_play = true        ; countdown starts after the card appears
countdown = 10          ; seconds on the countdown ring before auto-next
end_delay = 4           ; after the video ends, wait this long, then go

[episodes_panel]
# Browse the season in TMDB order (the correct order, always).
enabled = true
show_air_dates = true

[subtitles]
# First-run defaults. Users can still restyle in the CC panel (saved locally).
size = 1.0
color = #ffffff
bg_opacity = 0
position = 64           ; pixels above the control bar
edge = "outline"        ; outline | shadow | none

[audio]
# mono fixes the broken 5.1 downmix on dual-audio NF WEB-DL files.
default_mode = "mono"   ; mono | stereo | swap
default_boost = 4
auto_repair = true      ; auto-detect split stereo / dead channel -> mono

[gestures]
double_tap_seek = 10    ; mobile: double-tap sides to seek +-seconds
long_press_marks_intro = true

[player]
resume = true           ; remember position and offer to resume
title_overlay = true    ; show title card top-left while controls are visible
